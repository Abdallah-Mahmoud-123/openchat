<!DOCTYPE html>
<html lang="en" id="main_root" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <title>OpenChat</title>

  <!-- HTML -->


  <!-- Custom Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200..700&display=swap" rel="stylesheet">


</head>

<body>
   <div class="box" onclick="box()">
  <h1 id="a">•</h1>
  <h1 id="b">•</h1>
  <h1 id="c">•</h1>

 </div>

  <div id="msgArea">
    <ul id="ul">
  {% for msg in chat_history %}
    <li>
    <strong>{{ msg.username }}</strong> {{ msg.text }}
    </li>
  {% endfor %}
</ul>

  </div>
  <div class="input">
    <textarea oninput="check()" type="text" id="inpMsg" ></textarea>
    <button id="btnSend" disabled>Send</button>
  </div>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
